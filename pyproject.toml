[build-system]
requires = [
    "setuptools>=65",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "cPaiNN"
version = "1.0.0"
authors = [{name = "Martin Hoffmann Petersen", email = "mahpe@dtu.dk"}]
description = "Charge modification of the polarizable atom interaction neural network (cPaiNN) "
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL v3.0"}
classifiers = [
    "Development Status :: 1 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

dependencies = [
    "ase==3.23",
    "pandas==2.2.2",
    "asap3",
    "matscipy",
    "torch<=2.1.2",
    "scipy==1.14.1",
    "numpy==1.26.4",
    "toml==0.10.2",
]

[project.urls]
Source = "https://github.com/dtu-energy/cPaiNN"

[tool.setuptools]
packages = ["cPaiNN"]

